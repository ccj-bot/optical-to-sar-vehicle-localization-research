<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPGT 光学目标复核</title><link rel="stylesheet" href="target_review.css"></head><body><main><a href="index.html">← 场景入口</a><h1>TPGT 光学目标复核</h1><div class="toolbar"><b id="sceneTitle"></b><button id="prev">上一帧</button><button id="next">下一帧</button><button id="play">播放</button><button id="pause">暂停</button><span>速度</span><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><input id="frameInput" type="number" min="0" max="367" value="0"><button id="jump">跳转</button><span id="frameInfo"></span></div><section class="review-layout"><article class="panel image-panel"><div class="stage"><img id="optical"><canvas id="overlay"></canvas></div><div class="legend"><label><input id="yolo11Toggle" type="checkbox" checked> YOLO11 检测</label><label><input id="yolo26Toggle" type="checkbox" checked> YOLO26 检测</label><label><input id="carToggle" type="checkbox" checked> 车辆</label><label><input id="personToggle" type="checkbox" checked> 人员</label><label><input id="confidenceToggle" type="checkbox" checked> 显示类别+置信度</label><label><input id="machineToggle" type="checkbox" checked> 机器同目标建议</label></div><p class="muted">直接点击检测框即可设为当前人工目标；检测和机器跟随始终只是 proposal。</p></article><aside class="panel side"><h2>当前人工目标</h2><div id="targetMeta">尚未选择目标</div><button id="accept">A 接受当前建议</button><button id="reselect">R 重新选择目标框</button><div class="state-row"><span>当前帧状态</span><select id="frameState"><option value="UNKNOWN">不确定</option><option value="COMPLETE_VISIBLE">完整可见</option><option value="PARTIAL_VISIBLE">部分可见</option><option value="OCCLUDED">遮挡</option><option value="NOT_VISIBLE">不可见</option></select></div><div class="state-row"><span>当前目标</span><select id="identityStatus"><option value="AMBIGUOUS">身份存疑</option><option value="CLEAR">身份明确</option></select></div><div class="state-row"><span>研究决定</span><select id="admission"><option value="DEFER_COMPLEX">暂缓复杂目标</option><option value="ACCEPT_COMPLETE_CORE">纳入完整目标</option><option value="ACCEPT_OBSERVATION_ONLY">仅保留观察</option><option value="REJECT">排除</option></select></div><button id="freeze" class="warn">冻结光学目标</button><div id="status"></div><details><summary>高级 / 来源信息</summary><div id="provenance" class="small"></div></details><a id="sarLink" class="hidden" href="#">进入 SAR 观察</a></aside></section><section class="panel timeline-panel"><div class="timeline-head"><b>完整时序 0–367</b><span>快捷键：Space 播放/暂停 · ←/→ 1帧 · Shift+←/→ 10帧 · A 接受 · R 重选 · V/P/X</span></div><div id="timeline" class="timeline"><div class="track"></div><div id="detBands"></div><div id="machineBands"></div><div id="humanBand" class="band human"></div><div id="coreBand" class="band core"></div><div id="startHandle" class="handle"></div><div id="endHandle" class="handle"></div></div></section></main><script src="target_review_data.js"></script><script src="target_review.js"></script><script src="optical_review_enhancements.js"></script></body></html>
